spring:
  application:
    name: reactive-tasks
  r2dbc:
    # Render puede exponer DB_* o DATABASE_* según la integración configurada
    url: ${SPRING_R2DBC_URL:r2dbc:pool:postgresql://${DB_HOST:${DATABASE_HOST:${PGHOST:localhost}}}:${DB_PORT:${DATABASE_PORT:${PGPORT:5432}}}/${DB_NAME:${DATABASE_NAME:${PGDATABASE:appdb}}}?sslMode=${DB_SSL_MODE:${DATABASE_SSL_MODE:disable}}}
    username: ${SPRING_R2DBC_USERNAME:${DB_USER:${DATABASE_USER:${PGUSER:app}}}}
    password: ${SPRING_R2DBC_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:secret}}}}

  sql:
    init:
      mode: always # en prod se desactiva
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method
