spring:
  application:
    name: reactive-tasks
  r2dbc:
    # Usa pool + Postgres. Puedes sobreescribir con SPRING_R2DBC_URL
    url: ${SPRING_R2DBC_URL:r2dbc:pool:postgresql://localhost:5432/appdb}
    username: ${SPRING_R2DBC_USERNAME:app}
    password: ${SPRING_R2DBC_PASSWORD:secret}

  sql:
    init:
      mode: always # en prod se desactiva
server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs
    operationsSorter: method
