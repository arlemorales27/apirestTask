services:
  db:
    image: postgres:16-alpine
    container_name: pg-reactive
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://db:5432/appdb
      SPRING_R2DBC_USERNAME: app
      SPRING_R2DBC_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  pgdata:
